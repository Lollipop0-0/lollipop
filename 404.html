<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <base href="/lollipop/">

  <title>404 — Page Not Found | Karl Evan Tabunda</title>
  <meta name="description"
    content="The requested file, page, or repository route could not be found on Karl Evan Tabunda's portfolio.">
  <meta name="author" content="Karl Evan Tabunda">
  <meta name="robots" content="noindex, follow">

  <!-- Favicon / Tab Icon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png?v=2">
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="apple-touch-icon" href="assets/images/favicon.png?v=2">

  <!-- Google Fonts: Caveat (Handwritten), Inter (Body), JetBrains Mono (Terminal/Code), Newsreader (Serif Display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&display=swap"
    rel="stylesheet">

  <!-- Production Stylesheet (Pre-compiled & minified) -->
  <link rel="stylesheet" href="assets/css/styles.min.css">

  <!-- Anti-flash inline theme detection (Priority: localStorage -> System OS -> effective theme) -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('ket_portfolio_theme');
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var effectiveTheme = (savedTheme === 'dark' || (savedTheme !== 'light' && systemDark)) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', effectiveTheme);
        document.documentElement.setAttribute('data-theme-preference', savedTheme || 'system');
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <!-- Accessible Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Application Shell Mounting Point for 404 Error Showcase -->
  <div id="app" data-page="404">
    <!-- ComponentLoader dynamically mounts: header.html, error-404.html, footer.html, project-modal.html -->
    <noscript>
      <section class="error-showcase-section">
        <div class="container error-showcase-container">
          <div class="error-showcase-card">
            <div class="tape-strip tape-top-center" aria-hidden="true"></div>
            <div class="error-watermark-num" aria-hidden="true">404</div>
            <div class="error-showcase-content">
              <div class="error-status-pill">
                <span class="status-dot status-dot-warning" aria-hidden="true"></span>
                <span>HTTP 404 · ROUTE NOT FOUND</span>
              </div>
              <h1 class="error-showcase-title">Lost in the codebase?</h1>
              <p class="error-showcase-desc">The file, repository, or page you were looking for doesn't exist or was relocated.</p>
              <div class="error-showcase-actions">
                <a href="index.html" class="btn btn-primary">Back to Home →</a>
                <a href="about.html" class="btn btn-secondary">About Karl</a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </noscript>
  </div>

  <!-- Production Script Bundle (Deferred) -->
  <script defer src="assets/js/bundle.min.js"></script>
</body>

</html>
