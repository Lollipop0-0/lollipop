<!-- Certificates & Certifications Section -->

  <div class="container">
    <div class="section-header-bar">
      <div>

          <span class="eyebrow-bullet">•</span>
          <span>Verified Credentials</span>

        <h2 id="certificates-title">Certificates & Certifications</h2>
