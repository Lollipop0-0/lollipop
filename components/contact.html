      <!-- Polaroid Sticker with handwritten note -->
      <div class="contact-polaroid-wrap">
        <div class="tape-strip tape-top-left" aria-hidden="true"></div>
        <div class="contact-polaroid-card">
          <img src="assets/images/profile-sticker.jpg" alt="Karl Evan campus sticker photo"
            class="contact-polaroid-img">
        </div>
        <div class="handwritten-note contact-polaroid-note" aria-hidden="true">
          Let's<br>build<br>something!
        </div>
      </div>
    </div>

    <!-- Contact Form Card -->
    <div class="contact-form-card">
      <form id="contact-form" novalidate>
        <div class="contact-form-row">
          <div class="form-group">
            <label for="contact-name" class="form-label">Name</label>
            <input type="text" id="contact-name" name="name" class="form-input" placeholder="Your name" required
              autocomplete="name">
            <span id="contact-name-error" class="form-error-msg" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="contact-email" class="form-label">Email</label>
            <input type="email" id="contact-email" name="email" class="form-input" placeholder="you@example.com"
              required autocomplete="email">
            <span id="contact-email-error" class="form-error-msg" role="alert"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="contact-message" class="form-label">Message</label>
          <textarea id="contact-message" name="message" class="form-textarea"
            placeholder="Tell me about your project or inquiry..." required></textarea>
          <span id="contact-message-error" class="form-error-msg" role="alert"></span>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <span>Send Message</span>
        </button>

        <!-- Status Notice Area -->
        <div id="contact-status"></div>
      </form>
    </div>
  </div>
</section>
