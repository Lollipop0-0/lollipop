      <button type="button" class="header-search-btn" id="portfolio-search-trigger"

      <button type="button" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme"

        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"

          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <a href="assets/documents/Karl-Evan-Tabunda-Resume.pdf" target="_blank" rel="noopener noreferrer"
        class="btn btn-outline btn-sm nav-resume-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>Resume</span>
      </a>

      <button type="button" class="mobile-menu-toggle" aria-label="Open navigation menu" aria-expanded="false"
        aria-controls="mobile-drawer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>

<!-- Refined Portfolio Command Search Modal -->
<div id="portfolio-search-modal" class="search-modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true"
  aria-labelledby="search-modal-label">
  <div class="search-modal-dialog">
    <h2 id="search-modal-label" class="sr-only">Search Portfolio</h2>

    <!-- Search Input Bar -->
    <div class="search-input-wrap">
      <svg class="search-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="portfolio-search-input" class="search-input-field"
        placeholder="Search projects, skills, journey, contact..." aria-label="Search portfolio" autocomplete="off"
        spellcheck="false">
      <button type="button" id="search-clear-btn" class="search-clear-btn" aria-label="Clear search query"
        style="display: none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <kbd class="search-esc-hint" id="search-close-btn" title="Close search (Esc)">ESC</kbd>
    </div>

    <!-- Live Results Listbox Container -->
    <div id="portfolio-search-results" class="search-results-container" role="listbox"></div>

    <!-- Keyboard Navigation Footer Hints -->
    <div class="search-modal-footer">
      <div class="search-hints-group">
        <span class="search-hint-item"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
        <span class="search-hint-item"><kbd>↵</kbd> Select</span>
        <span class="search-hint-item"><kbd>esc</kbd> Close</span>
      </div>
      <span class="search-count-badge" id="search-count-badge">Quick Jump</span>
    </div>
  </div>
</div>
