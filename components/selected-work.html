<!-- 02 — SELECTED WORK / PROJECTS Section -->
<section id="selected-work" class="selected-work-section" aria-labelledby="selected-work-title">
  <div id="projects" class="projects-scroll-anchor" style="position: relative; top: -80px;" aria-hidden="true"></div>
  <div class="container">
    <!-- Work Section Header (Richard Miculob layout with Karl's kicker) -->
    <div class="work-header">
      <div class="work-header-text">
        <span class="section-kicker-num">02</span>
        <div class="section-label">Selected Work</div>
        <h2 id="selected-work-title" class="section-heading">Work Gallery<span class="accent-dot">.</span></h2>
        <p class="section-desc">A collection of systems, digital projects, and technical work I've built.</p>
      </div>
    </div>

    <!-- Desktop 3D Interactive Album Cover Flow (Visible > 768px) -->
    <div class="work-album" id="work-album" aria-label="Selected Projects 3D Album Cover Flow" role="region">
      <button type="button" class="work-album-nav work-album-nav-prev" id="work-album-prev" aria-label="Previous project">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
      </button>

      <div class="work-album-inner" id="work-album-inner">
        <!-- Injected dynamically by renderSelectedProjects() in app.js -->
      </div>

      <button type="button" class="work-album-nav work-album-nav-next" id="work-album-next" aria-label="Next project">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>
    </div>

    <!-- Mobile Stack Stage (Visible <= 768px) -->
    <div class="work-mobile-stack-wrap" id="work-mobile-stack-wrap" aria-label="Mobile Project Stack Carousel">
      <div class="work-mobile-stack" id="work-mobile-stack" role="button" tabindex="0"
        aria-label="Tap to view next project">
        <!-- Injected dynamically by renderSelectedProjects() in app.js -->
      </div>
      <div class="work-mobile-hint">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path
            d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3">
          </path>
        </svg>
        <span>Tap or swipe image to cycle projects</span>
      </div>
    </div>

    <!-- Dynamic Active Project Details Box (Smooth Animated Fade) -->
    <div class="work-info" id="work-info" aria-live="polite">
      <!-- Injected dynamically by renderSelectedProjects() in app.js -->
    </div>

    <!-- Bottom Secondary CTA -->
    <div class="section-footer-action">
      <a href="projects.html" class="btn btn-outline" id="view-all-work-btn">
        <span>Explore All Projects (6) →</span>
      </a>
    </div>
  </div>
</section>
