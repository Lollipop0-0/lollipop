[build]
  publish = "."
  command = "pip install -r requirements.txt && python optimize.py"
  functions = "netlify/functions"

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

# Redirect old /components/about path to the real about page
[[redirects]]
  from = "/components/about"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/components/about.html"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/api/contributions.php"
  to = "/.netlify/functions/contributions"
  status = 200
  force = true

[[redirects]]
  from = "/api/contributions"
  to = "/.netlify/functions/contributions"
  status = 200
  force = true

# ==============================================================================
# Netlify Edge CDN & Browser Caching Headers
# ==============================================================================

# Fast revalidation and security headers for HTML pages
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Dynamic HTML partial components fetched by ComponentLoader
[[headers]]
  for = "/components/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Stylesheets, scripts, and images with versioned queries and immutable static assets
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

