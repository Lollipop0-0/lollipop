  <!-- Anti-flash inline theme detection (Priority: localStorage -> System OS -> effective theme) -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('ket_portfolio_theme');
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var effectiveTheme = (savedTheme === 'dark' || (savedTheme !== 'light' && systemDark)) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', effectiveTheme);
        document.documentElement.setAttribute('data-theme-preference', savedTheme || 'system');
      } catch (e) { }
    })();
  </script>
